<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FOCENOFF — видеомонтажёр. Работаю с YouTube-каналами от 2M+ подписчиков." />
  <title>FOCENOFF — Video Editor</title>
  <link rel="icon" href="ava.png" sizes="any" />
  <link rel="apple-touch-icon" href="ava.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PRELOADER -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__center">
      <img src="ava.png" alt="" class="preloader__avatar" />
    </div>
    <div class="preloader__foot">
      <div class="preloader__track">
        <div class="preloader__fill" id="preloaderFill"></div>
      </div>
      <span class="preloader__num" id="preloaderNum">0</span>
    </div>
  </div>

  <!-- HERO CANVAS (3D HERO MODEL) -->
  <canvas class="hero-canvas" id="heroCanvas" aria-hidden="true"></canvas>

  <!-- CURSOR -->
  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor__ring"></div>
    <div class="cursor__dot"></div>
    <div class="cursor__label" id="cursorLabel"></div>
  </div>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="header__inner">
      <a href="#top" class="header__logo" aria-label="На главную">
        <img src="ava.png" alt="" class="header__logo-img" aria-hidden="true" width="28" height="28" />
        <span class="header__logo-text" data-text="headerLogo">FOCENOFF</span>
      </a>
      <button class="header__menu-btn" id="menuToggle" aria-label="Открыть меню" aria-expanded="false">
        <span class="header__menu-icon" aria-hidden="true">
          <span></span><span></span>
        </span>
      </button>
    </div>
  </header>

  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay" aria-hidden="true" role="dialog" aria-label="Навигация">
    <div class="menu-overlay__inner">
      <nav class="menu-nav" aria-label="Главное меню">
        <ul id="menuList"></ul>
      </nav>
      <div class="menu-socials">
        <a href="https://t.me/MAKC_CBAPKA" data-link="telegramDM" target="_blank" rel="noopener noreferrer">Telegram DM</a>
        <a href="https://t.me/focenoff" data-link="telegramChannel" target="_blank" rel="noopener noreferrer">Channel</a>
        <a href="https://www.youtube.com/channel/UC_dVguEpMY8Vbiy0PKDjSwQ" data-link="youtube" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a href="https://www.tiktok.com/@focenoff" data-link="tiktok" target="_blank" rel="noopener noreferrer">TikTok</a>
      </div>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero" id="top">
    <div class="hero__content">
      <div class="hero__eyebrow">
        <span class="hero__eyebrow-tag">Motion Artist & Video Editor</span>
      </div>
      <h1 class="hero__title" id="heroTitle">
        <span class="hero__line" data-text="heroTitleLine1">MAXIM</span>
        <span class="hero__line hero__line--outline" data-text="heroTitleLine2">FOCENOFF</span>
      </h1>
    </div>
    <div class="hero__bottom">
      <div class="hero__cta-group">
        <a href="#works" class="hero__view-work" aria-label="К работам">
          <span>ПОСМОТРЕТЬ РАБОТЫ</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M5 19L19 5M19 5H8M19 5v11"/>
          </svg>
        </a>
        <a href="https://t.me/MAKC_CBAPKA" data-link="telegramDM" class="hero__contact-btn" target="_blank" rel="noopener noreferrer" aria-label="Написать в Telegram">CONTACT ME</a>
      </div>
    </div>
    <span class="hero__index" aria-hidden="true">01</span>
  </section>

  <!-- MARQUEE -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee__track" id="marqueeTrack"></div>
  </div>

  <main>

    <!-- WORKS -->
    <section class="works" id="works">
      <div class="works__list" id="worksTrack"></div>
    </section>

    <!-- 3D MODEL — BEFORE ABOUT -->
    <section class="model-spot" id="modelAboutSpot">
      <span class="section__index" aria-hidden="true"></span>
    </section>

    <!-- WORKED WITH -->
    <section class="worked-with" id="workedWith" aria-label="Worked With">
      <p class="worked-with__label">Worked With:</p>
      <div class="worked-with__track-wrap" aria-hidden="true">
        <div class="worked-with__track" id="workedWithTrack"></div>
      </div>
    </section>

    <!-- CONTACT CTA -->
    <section class="contact-cta" id="contact">
      <div class="contact-cta__inner">
        <p class="contact-cta__label">Готов к новым проектам</p>
        <a href="https://t.me/MAKC_CBAPKA" data-link="telegramDM" class="contact-cta__link" target="_blank" rel="noopener noreferrer" aria-label="Написать в Telegram">
          <span data-text="contactCtaLine1">НАПИСАТЬ</span>
          <span data-text="contactCtaLine2">В TELEGRAM</span>
          <span class="contact-cta__arrow" aria-hidden="true">↗</span>
        </a>
        <div class="contact-cta__socials">
          <a href="https://t.me/focenoff" data-link="telegramChannel" target="_blank" rel="noopener noreferrer">TG Channel</a>
          <a href="https://www.youtube.com/channel/UC_dVguEpMY8Vbiy0PKDjSwQ" data-link="youtube" target="_blank" rel="noopener noreferrer">YouTube</a>
          <a href="https://www.tiktok.com/@focenoff" data-link="tiktok" target="_blank" rel="noopener noreferrer">TikTok</a>
        </div>
      </div>
    </section>

    <!-- 3D MODEL — AFTER CONTACT -->
    <section class="model-spot" id="modelContactSpot">
      <span class="section__index" aria-hidden="true"></span>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__name" data-text="footerName">MAXIM FOCENOFF</span>
      <span class="footer__copy">Developed by <a href="https://github.com/mrzolz19" target="_blank" rel="noopener noreferrer" style="text-decoration: underline; color: inherit; font-weight: 500;">MrZolz</a></span>
      <a href="https://t.me/MAKC_CBAPKA" data-link="telegramDM" class="footer__contact" target="_blank" rel="noopener noreferrer">CONTACT →</a>
    </div>
  </footer>

  <!-- VIDEO MODAL -->
  <div class="v-modal" id="vModal" hidden role="dialog" aria-modal="true" aria-label="Видеоплеер">
    <button class="v-modal__close" id="vModalClose" aria-label="Закрыть видео">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="v-modal__backdrop" id="vModalBackdrop"></div>
    <div class="v-modal__box">
      <div class="v-modal__ratio">
        <iframe id="vModalIframe" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" title="Видео"></iframe>
        <video id="vModalVideo" controls playsinline preload="metadata" hidden></video>
      </div>
    </div>
  </div>

  <!-- TEMPLATES -->
  <template id="tplChapterCard">
    <div class="works__chapter" data-work-chapter>
      <div class="works__chapter-header">
        <span class="works__chapter-num"></span>
        <h2 class="works__chapter-title"></h2>
        <span class="works__chapter-count"></span>
      </div>
    </div>
  </template>

  <template id="tplMotionCard">
    <article class="work-item work-item--motion-card" data-work>
      <div class="work-item__media motion-card">
        <img class="work-item__thumb motion-card__poster" alt="Превью motion нарезки" loading="lazy" hidden />
        <video class="motion-card__preview" muted loop playsinline preload="metadata"></video>
        <button class="work-item__play motion-card__play" aria-label="Смотреть motion нарезку">
          <span class="work-item__play-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="work-item__play-label">PLAY</span>
        </button>
      </div>
      <div class="work-item__caption">
        <div class="work-item__caption-left">
          <h3 class="work-item__name motion-title"></h3>
          <span class="work-item__type motion-type"></span>
        </div>
        <div class="work-item__caption-right">
          <span class="work-item__stat motion-views"></span>
          <a href="#" class="work-item__yt-link motion-yt-link" target="_blank" rel="noopener noreferrer" aria-label="Оригинал на YouTube">Оригинал ↗</a>
        </div>
      </div>
    </article>
  </template>

  <template id="tplVideoCard">
    <article class="work-item work-item--yt" data-work>
      <div class="work-item__media">
        <img class="work-item__thumb" loading="lazy" alt="" />
        <button class="work-item__play" aria-label="Смотреть видео">
          <span class="work-item__play-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="work-item__play-label">PLAY</span>
        </button>
      </div>
      <div class="work-item__caption">
        <div class="work-item__caption-left">
          <h3 class="work-item__name"><a target="_blank" rel="noopener noreferrer"></a></h3>
          <span class="work-item__type"></span>
        </div>
        <div class="work-item__caption-right">
          <span class="work-item__stat"></span>
        </div>
      </div>
    </article>
  </template>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
  <script type="module" src="hero3d.js"></script>
</body>
</html>
